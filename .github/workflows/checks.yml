name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: tools
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install declared SDK and runtime dependencies
        run: python -m pip install -r requirements-companion.txt -r requirements-flash.txt
      - name: Firmware integrity, source version, OTA reserve and fixed partitions
        run: python tools/check_firmware.py
      - name: Native network and archive policies
        run: python -m unittest test_hotspot_policy test_archive_lease test_embed_assets test_firmware_delivery
      - name: Build and validate ToolPkg, including storage and queue regressions
        run: python tools/package_operit.py
      - name: Actual MCP SDK over HTTP and STDIO
        run: python -m unittest test_companion_experience_sdk.LocalSDKTests.test_new_tools_through_http_sdk test_companion_experience_sdk.LocalSDKTests.test_stdio_new_tools
      - name: Documentation links
        run: python tools/check_documentation.py --repository .
      - name: Build and audit Linux delivery
        run: |
          python -c "from pathlib import Path; from package_companion import server_package; server_package(Path('delivery'))"
          python tools/audit_delivery.py delivery/AI_Doll_Server_v2.25.1.tar.gz
          python tools/check_documentation.py --archive delivery/AI_Doll_Server_v2.25.1.tar.gz
