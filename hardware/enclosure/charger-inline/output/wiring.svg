<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#597663"/></marker></defs><style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#293f33}.label{font-size:17px}.small{font-size:14px;fill:#5e7563}.positive{stroke:#c6554c;stroke-width:5;fill:none}.negative{stroke:#3e4e50;stroke-width:5;fill:none}.pad{fill:#dfc17a;stroke:#816c3b;stroke-width:2}</style>
<rect width="1280" height="690" rx="18" fill="#f5f7f0"/><text x="48" y="52" font-size="29" font-weight="650">四线取电：电池一组，主板5V一组</text><text x="48" y="86" class="small">根据用户提供的卖家焊点标注图整理 · 电气关系示意，不代表元件实际比例或SM针位</text>
