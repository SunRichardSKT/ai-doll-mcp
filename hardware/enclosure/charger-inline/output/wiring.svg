<rect x="45" y="514" width="1167" height="126" rx="14" fill="#ece5d1"/><text x="67" y="547" class="label">装配原则</text><text x="67" y="576" class="small">B+/B−只接电池；主板接独立的输入输出正/负极，不额外短接两个负极。</text><text x="67" y="602" class="small">保留现有SM两线极性；先确认输出约5V再接主板。USB插拔是否引起重启、温升及线夹强度仍需实测。</text></svg>