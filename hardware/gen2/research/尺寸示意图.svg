<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2000" viewBox="0 0 1200 2000"><rect width="1200" height="2000" fill="white"/><g font-family="Microsoft YaHei,sans-serif" fill="#18332f"><text x="60" y="85" font-size="44" font-weight="700">核心尺寸参考</text><text x="60" y="142" font-size="26" fill="#596a67">三组采用相同绘图比例；尺寸顺序：长 × 宽 × 厚</text><text x="60" y="218" font-size="32">A · 5 × 3.5 × 2 cm</text><polygon points="180,490 580,490 685,420 285,420" fill="#dcf1e8" stroke="#376c60" stroke-width="3"/><polygon points="180,650 580,650 580,490 180,490" fill="#a5d4be" stroke="#376c60" stroke-width="3"/><polygon points="580,650 685,580 685,420 580,490" fill="#73ab94" stroke="#376c60" stroke-width="3"/><text x="60" y="758" font-size="32">B · 7 × 4.5 × 2.5 cm</text><polygon points="180,990 740,990 875,900 315,900" fill="#dcf1e8" stroke="#376c60" stroke-width="3"/><polygon points="180,1190 740,1190 740,990 180,990" fill="#a5d4be" stroke="#376c60" stroke-width="3"/><polygon points="740,1190 875,1100 875,900 740,990" fill="#73ab94" stroke="#376c60" stroke-width="3"/><text x="60" y="1298" font-size="32">C · 9 × 6 × 3.5 cm</text><polygon points="180,1450 900,1450 1080,1330 360,1330" fill="#dcf1e8" stroke="#376c60" stroke-width="3"/><polygon points="180,1730 900,1730 900,1450 180,1450" fill="#a5d4be" stroke="#376c60" stroke-width="3"/><polygon points="900,1730 1080,1610 1080,1330 900,1450" fill="#73ab94" stroke="#376c60" stroke-width="3"/><text x="60" y="1890" font-size="26" fill="#596a67">仅用于研发偏好调查，不代表最终产品尺寸。</text><text x="60" y="1940" font-size="26" fill="#596a67">屏幕显示并非实物 1:1，请以标注尺寸为准。</text></g></svg>