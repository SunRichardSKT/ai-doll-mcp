<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640"><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#203e34}.title{font-size:27px;font-weight:bold}.body{font-size:18px}.small{font-size:16px}.wire{stroke:#32795e;stroke-width:3;fill:none}</style><rect width="900" height="640" rx="18" fill="#f3f5ef"/><text x="35" y="48" class="title">第一代 C3 核心 · 两线电阻扩展</text><text x="35" y="80" class="small">现有分压和4051保持原样 · 6路压力＋1路温度＋1路湿润片</text><rect x="35" y="120" width="200" height="260" rx="16" fill="#dde9de"/><text x="60" y="158" class="body">J1～J6：压力</text><text x="60" y="215" class="body">J7 / CH6：温度</text><text x="60" y="285" class="body">J8 / CH7：湿润</text><text x="60" y="346" class="small">PA2.0（最终版）</text><path class="wire" d="M235 205H395M235 225H395M235 275H395M235 295H395"/><rect x="395" y="170" width="455" height="85" rx="12" fill="white"/><text x="415" y="202" class="body">NTC 10kΩ / B3435 · 近表层薄布下</text><text x="415" y="232" class="small">UT422探头 → 焊接PA2.0 2P线束</text><rect x="395" y="270" width="455" height="110" rx="12" fill="white"/><rect x="420" y="298" width="40" height="50" fill="#94aaa0"/><rect x="480" y="298" width="40" height="50" fill="#94aaa0"/><text x="545" y="310" class="body">两片导电布分开</text><text x="545" y="343" class="small">间隔2～3mm，吸水布覆盖</text><path class="wire" d="M130 380V410H620V380"/><text x="150" y="403" class="small">关联一只现有掌部压力，不与湿润片并接</text><rect x="35" y="440" width="815" height="150" rx="14" fill="white"/><text x="55" y="473" class="body">共用电路：3.3V → 主板4.7k → 探头 → 信号 → 主板10k → GND</text><text x="55" y="510" class="body">擦眼泪：湿润600ms＋掌部按压 → 一次wipe → 干燥1000ms复位</text><text x="55" y="548" class="small">两脚不是电源正负极；NTC测接触温度，不是人体核心体温。</text><text x="55" y="575" class="small">端口号仅为示例；接线前断电，按自己保存的配置修改。</text></svg>