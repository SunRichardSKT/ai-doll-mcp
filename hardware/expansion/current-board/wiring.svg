<text x="677" y="630" font-size="19" style="fill:#15803d" font-weight="700">8  SWITCH · GPIO21</text>
<text x="663" y="660" font-size="16" style="fill:#475569">按编号一一连接；不是原板插座</text>
<rect x="1000" y="190" width="560" height="108" rx="15" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="1024" y="230" font-size="23" style="fill:#d97706" font-weight="700">两路独立稳压 / 公共地</text>
<text x="1024" y="267" font-size="17" style="fill:#475569">SYS5V → 3V3_LOGIC；SYS5V → 3V3_MOTOR</text>
<rect x="1000" y="322" width="560" height="108" rx="15" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
<text x="1024" y="362" font-size="23" style="fill:#b45309" font-weight="700">温度 · 1～2只 DS18B20</text>
<text x="1024" y="399" font-size="17" style="fill:#475569">3V3_LOGIC / GND / GPIO1，数据线上拉4.7kΩ</text>
<rect x="1000" y="454" width="560" height="108" rx="15" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="1024" y="494" font-size="23" style="fill:#2563eb" font-weight="700">姿态变化 · LIS3DH</text>
<text x="1024" y="531" font-size="17" style="fill:#475569">3V3_LOGIC / GND / GPIO6 SDA / GPIO7 SCL</text>
<rect x="1000" y="586" width="560" height="108" rx="15" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="1024" y="626" font-size="23" style="fill:#7c3aed" font-weight="700">振动 · ERM马达与驱动</text>
<text x="1024" y="663" font-size="17" style="fill:#475569">GPIO10 → MOSFET；马达使用匹配的独立电源</text>
<rect x="1000" y="718" width="560" height="108" rx="15" fill="#ffffff" stroke="#be185d" stroke-width="1.5"/>
<text x="1024" y="758" font-size="23" style="fill:#be185d" font-weight="700">灯效 · 单颗低电流LED</text>
<text x="1024" y="795" font-size="17" style="fill:#475569">GPIO20 → 1kΩ → LED → GND</text>
<rect x="1000" y="850" width="560" height="108" rx="15" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
<text x="1024" y="890" font-size="23" style="fill:#15803d" font-weight="700">开关 · 一个无源干接点</text>
<text x="1024" y="927" font-size="17" style="fill:#475569">GPIO21，上拉10kΩ；串联1kΩ，滤波100nF</text>
<rect x="640" y="718" width="310" height="240" rx="15" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="662" y="757" font-size="23" style="fill:#9a3412" font-weight="700">装配边界</text>
<text x="662" y="798" font-size="16" style="fill:#9a3412">马达不接FSR口或GPIO电源</text>
<text x="662" y="828" font-size="16" style="fill:#9a3412">两个稳压输出不互相并联</text>
<text x="662" y="858" font-size="16" style="fill:#9a3412">GPIO20/21与UART互斥</text>
<text x="662" y="888" font-size="16" style="fill:#9a3412">扩展不挤入原电池仓</text>
<text x="662" y="918" font-size="16" style="fill:#9a3412">需扩展候选软件，逐项接线核对</text>
<text x="42" y="1010" font-size="19" style="fill:#475569">仅为接线设计示意：按2026-10-17原生回读焊盘坐标绘制；未修改原PCB，不是制造图。</text>
<text x="42" y="1050" font-size="19" style="fill:#475569">扩展候选支持温度、姿态、振动、灯和开关；需同批软件，新增模块逐项接线验收。</text>
<text x="42" y="1090" font-size="19" style="fill:#475569">电源先断开再接线；正式装配保留原C9（1nF）及R17（1kΩ）；交叉线没有连接点时不相连。</text>
<text x="42" y="1132" font-size="18" style="fill:#64748b">完整电路、器件规格、软件边界和安装步骤：同目录README / WIRING / SOFTWARE / ACCEPTANCE。</text>
</svg>
