<text x="59" y="789" font-size="19" font-weight="700">以模块自身丝印和封装脚号双重核对</text>
<text x="59" y="827" font-size="18" style="fill:#475569">灰色焊点与八路压力保持原用途。</text>
<text x="59" y="862" font-size="18" style="fill:#475569">背面观察需翻转，不能直接照搬此图。</text>
<text x="59" y="901" font-size="18" style="fill:#475569">SW1中脚与模块5V同属SYS5V。</text>
