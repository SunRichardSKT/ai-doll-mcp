[platformio]
default_envs = supermini-lab

[env:supermini-lab]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    paulstoffregen/OneWire@2.3.8
build_src_filter = +<lab_main.cpp>
build_flags = -Wall -Wextra -fstack-usage -Wframe-larger-than=2048 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts = pre:../tools/embed_channel_editor.py
